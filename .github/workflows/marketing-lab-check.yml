name: Marketing Lab checks
on:
  push:
    paths:
      - "marketing-lab/**"
      - ".github/workflows/marketing-lab-check.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript syntax
        run: node --check marketing-lab/assets/core.js
      - name: App smoke tests
        run: node marketing-lab/tests/smoke.cjs
